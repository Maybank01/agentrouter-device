[package]
name = "agentrouter-app"
description = "AgentRouter: a small desktop shell around the cloud web app, with the linked-device connector built in."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
# `agentrouter` is the command-line helper (crates/connector-cli).
name = "agentrouter-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agentrouter-device-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"

[features]
# Production behaviour without the tauri CLI (`cargo build --release` works as is).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
