[package]
name = "agentrouter-app"
description = "AgentRouter: a small desktop shell around the cloud web app, with the linked-device connector built in."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "agentrouter"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agentrouter-device-core.workspace = true
serde.workspace = true
serde_json.workspace = true
# `unstable`: one window holding the cloud page and the native 电脑 panel side by side (multiwebview).
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[features]
# Production behaviour without the tauri CLI (`cargo build --release` works as is).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# GUI smoke test for CI only (scenes + screenshots, see .github/workflows/ci.yml); never in releases.
smoke = []
