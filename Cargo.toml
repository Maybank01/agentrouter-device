[workspace]
resolver = "3"
members = ["crates/device-core", "crates/connector-cli", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Maybank01/agentrouter-device"
publish = false

[workspace.dependencies]
agentrouter-device-core = { path = "crates/device-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = "0.61"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
