[workspace]
resolver = "3"
members = ["crates/sandbox", "crates/linker", "crates/aggregator", "crates/checkpoint", "crates/device-core", "crates/connector-cli"]
# The desktop shell (app/) is frozen (docs/LINKER-MCP.md §0): source kept, out of the workspace, CI and releases.
exclude = ["app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Maybank01/agentrouter-device"
publish = false

[workspace.dependencies]
# TLS backend features are chosen by the binary (connector-cli: native-tls by default, rustls for the static build).
agentrouter-device-core = { path = "crates/device-core", default-features = false }
agentrouter-sandbox = { path = "crates/sandbox" }
agentrouter-linker = { path = "crates/linker", default-features = false }
agentrouter-aggregator = { path = "crates/aggregator" }
agentrouter-checkpoint = { path = "crates/checkpoint" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = "1.54"
windows-sys = "0.61"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
