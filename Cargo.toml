[workspace]
resolver = "3"
members = ["crates/sandbox", "crates/linker", "crates/checkpoint", "crates/device-core", "crates/connector-cli", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Maybank01/agentrouter-device"
publish = false

[workspace.dependencies]
agentrouter-device-core = { path = "crates/device-core" }
agentrouter-sandbox = { path = "crates/sandbox" }
agentrouter-linker = { path = "crates/linker" }
agentrouter-checkpoint = { path = "crates/checkpoint" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = "1.54"
windows-sys = "0.61"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
