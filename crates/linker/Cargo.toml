[package]
name = "agentrouter-linker"
description = "AgentRouter device: the Linker — one outbound WebSocket per linked folder (identity, token, reconnect, heartbeat, frame relay). It has no capabilities of its own (docs/LINKER-MCP.md §3)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "agentrouter_linker"

[dependencies]
agentrouter-device-core.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
base64 = "0.23"
getrandom = "0.4"
serde_json.workspace = true
sha2 = "0.11"
tokio = { workspace = true, features = ["rt", "macros", "sync", "time", "net", "io-util"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }

# TLS: the system's (native-tls; Schannel / Secure Transport / OpenSSL) by default; rustls with the bundled web PKI
# roots for the static Linux build of hostd (musl, no OpenSSL; LINKER-MCP §13.1).
[features]
default = ["native-tls"]
native-tls = ["tokio-tungstenite/native-tls", "agentrouter-device-core/native-tls"]
rustls = ["tokio-tungstenite/rustls-tls-webpki-roots", "agentrouter-device-core/rustls"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
