[package]
name = "agentrouter-device-core"
description = "AgentRouter linked device: protocol checks, local gate, jobs, audit log, key store and the gateway connection."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "agentrouter_device"

[dependencies]
base64 = "0.23"
ed25519-dalek = "3"
getrandom = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
native-tls = "0.2"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "native-tls"] }
ureq = { version = "3", default-features = false, features = ["native-tls", "json"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
