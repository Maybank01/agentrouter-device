[package]
name = "agentrouter-device-core"
description = "AgentRouter device core: pairing and token, keys, protocol primitives, the argument-level audit, pinned MCP packages, config (and what `mcp-serve local` still needs)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "agentrouter_device"

[dependencies]
base64 = "0.23"
ed25519-dalek = "3"
getrandom = "0.4"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
agentrouter-sandbox.workspace = true
ureq = { version = "3", default-features = false, features = ["json"] }
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"] }
# Who listens on a loopback port (preview streams in folder mode, #139). MIT, GyulyVGC/listeners.
listeners = "0.6"
# Steam libraries and app manifests (Cloud DEVICES §2.3). MIT, WilliamVenner/steamlocate-rs.
steamlocate = "2.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# App bundles' Info.plist (Cloud DEVICES §2.3). MIT, ebarnard/rust-plist.
plist = "1.10"

[target.'cfg(windows)'.dependencies]
# Installed programs (Cloud DEVICES §2.3): the Uninstall keys and GOG (winreg, MIT) and Store / MSIX packages through
# PackageManager (windows, MIT / Apache-2.0).
winreg = "0.56"
windows = { version = "0.62", features = ["ApplicationModel", "Management_Deployment", "Foundation_Collections"] }
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_StationsAndDesktops",
  "Win32_System_SystemInformation",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# TLS for pairing and tokens: native-tls by default; rustls (ring + bundled web PKI roots) for the static Linux build.
[features]
default = ["native-tls"]
native-tls = ["ureq/native-tls", "agentrouter-sandbox/native-tls"]
rustls = ["ureq/rustls", "agentrouter-sandbox/rustls"]
