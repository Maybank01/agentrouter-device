[package]
name = "agentrouter-device-core"
description = "AgentRouter device core: pairing and token, keys, protocol primitives, the argument-level audit, pinned MCP packages, config (and what `mcp-serve local` still needs)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "agentrouter_device"

[dependencies]
base64 = "0.23"
ed25519-dalek = "3"
getrandom = "0.4"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
agentrouter-sandbox.workspace = true
ureq = { version = "3", default-features = false, features = ["json"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_StationsAndDesktops",
  "Win32_System_SystemInformation",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# TLS for pairing and tokens: native-tls by default; rustls (ring + bundled web PKI roots) for the static Linux build.
[features]
default = ["native-tls"]
native-tls = ["ureq/native-tls"]
rustls = ["ureq/rustls"]
