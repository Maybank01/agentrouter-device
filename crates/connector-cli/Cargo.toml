[package]
name = "agentrouter-device-cli"
description = "AgentRouter linked device, command line (servers and headless use)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "agentrouter"
path = "src/main.rs"

# The earlier name, same program.
[[bin]]
name = "agentrouter-device"
path = "src/alias.rs"

[dependencies]
agentrouter-aggregator.workspace = true
agentrouter-checkpoint.workspace = true
agentrouter-device-core.workspace = true
agentrouter-hostd-link.workspace = true
agentrouter-sandbox.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
# termination: Ctrl+Break and closing the console window also stop jobs and disconnect.
ctrlc = { version = "3", features = ["termination"] }
serde_json.workspace = true
sha2 = "0.11"
# ripgrep's directory walker (.gitignore/.ignore rules, sorted walks): BurntSushi/ripgrep, Unlicense OR MIT.
ignore = "0.4.33"
# ripgrep's searcher and Rust-regex matcher (binary detection, BOM sniffing): same repository and licence.
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
# Pseudo-terminals for interactive programs (openpty on Unix, ConPTY on Windows): wezterm/wezterm, MIT.
portable-pty = "0.9.0"
# File-change notifications (inotify, FSEvents, ReadDirectoryChangesW): notify-rs/notify, CC0-1.0.
notify = "8.2.0"
# Opens the pairing page in the default browser on a double-click start: Byron/open-rs, MIT. On Windows through
# ShellExecuteExW (`shellexecute-on-windows`), never its default hidden PowerShell launcher (docs/AV-HYGIENE.md).
open = { version = "5.4.4", features = ["shellexecute-on-windows"] }
# A local server's login address as a QR in the terminal (`link__login`): kennytm/qrcode-rust, MIT / Apache-2.0.
qrcode = { version = "0.14.1", default-features = false }

# TLS: native-tls by default (the person's PC); `--no-default-features --features rustls` for the static Linux
# build of hostd that cloud sandboxes run (musl, no OpenSSL; HOSTD-MCP §13.1, .github/workflows/hostd.yml).
[features]
default = ["native-tls"]
native-tls = ["agentrouter-device-core/native-tls", "agentrouter-hostd-link/native-tls"]
rustls = ["agentrouter-device-core/rustls", "agentrouter-hostd-link/rustls"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# On-demand checkouts of space versions (Cloud #2767, PROJECT-SERVICE §5.5.4 "Linux"): cberner/fuser, MIT, 0.18.0
# (2026-07-22, ~6M downloads), pure Rust (no libfuse); mounts through /dev/fuse (fusermount3 when not root).
# The lower layer reads the node daemon over plain HTTP through the sandbox's egress proxy (squid on the node), which
# forwards absolute-form GET/POST to the daemon and refuses CONNECT tunnels; ureq 3 only tunnels (CONNECT) through an
# HTTP proxy (Dev 10-22: "CONNECT proxy failed: 403"), so this layer uses reqwest's blocking client (seanmonstar/reqwest,
# MIT/Apache-2.0, 0.13, active; HTTP/1 only, no TLS: the daemon is plain HTTP on the node), which forwards http:// URLs
# through HTTP_PROXY in absolute form and honours NO_PROXY.
[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.18.0", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "query"] }
serde.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Console", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_System_Com"] }
# The native folder picker on a double-click start (the shell's IFileOpenDialog): PolyMeilex/rfd, MIT.
rfd = { version = "0.17.2", default-features = false }

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
