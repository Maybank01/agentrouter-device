[package]
name = "agentrouter-device-cli"
description = "AgentRouter linked device, command line (servers and headless use)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "agentrouter"
path = "src/main.rs"

# The earlier name, same program.
[[bin]]
name = "agentrouter-device"
path = "src/alias.rs"

[dependencies]
agentrouter-aggregator.workspace = true
agentrouter-checkpoint.workspace = true
agentrouter-device-core.workspace = true
agentrouter-linker.workspace = true
agentrouter-sandbox.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
# termination: Ctrl+Break and closing the console window also stop jobs and disconnect.
ctrlc = { version = "3", features = ["termination"] }
serde_json.workspace = true
sha2 = "0.11"
# ripgrep's directory walker (.gitignore/.ignore rules, sorted walks): BurntSushi/ripgrep, Unlicense OR MIT.
ignore = "0.4.33"
# ripgrep's searcher and Rust-regex matcher (binary detection, BOM sniffing): same repository and licence.
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
# Pseudo-terminals for interactive programs (openpty on Unix, ConPTY on Windows): wezterm/wezterm, MIT.
portable-pty = "0.9.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Console", "Win32_Foundation"] }

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
