[package]
name = "agentrouter-device-cli"
description = "AgentRouter linked device, command line (servers and headless use)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "agentrouter"
path = "src/main.rs"

# The earlier name, same program.
[[bin]]
name = "agentrouter-device"
path = "src/alias.rs"

[dependencies]
agentrouter-device-core.workspace = true
# termination: Ctrl+Break and closing the console window also stop jobs and disconnect.
ctrlc = { version = "3", features = ["termination"] }
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Console", "Win32_Foundation"] }

[build-dependencies]
embed-resource = "3"
