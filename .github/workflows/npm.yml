name: npm packages

# Builds the npm packages (`@agentrouter-top/cli` + `@agentrouter-top/cli-<os>-<arch>`) from a release build
# and uploads the tarballs; they are published from a maintainer machine with
# `npm publish <tgz> --access public --tag <tag>`: the platform package first, and the main package
# only once `npm view <platform package>@<version>` answers (no npm token in CI).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version, e.g. 0.1.0-dev.1"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Release build
        shell: pwsh
        run: |
          # Paths in panic messages: the runner workspace and cargo home, nothing from a person's machine.
          $env:RUSTFLAGS = "--remap-path-prefix=$env:GITHUB_WORKSPACE=src --remap-path-prefix=$env:USERPROFILE=~"
          cargo build --release --locked -p agentrouter-device-cli
      - name: Pack
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          node npm/pack.mjs --version $env:VERSION --binary win32-x64=target/release/agentrouter.exe
          New-Item -ItemType Directory -Force dist | Out-Null
          npm pack ./npm/out/cli-win32-x64 ./npm/out/agentrouter --pack-destination dist
          Get-ChildItem dist | Format-Table Name, Length
          Get-FileHash dist/*.tgz -Algorithm SHA256 | Format-Table Hash, Path
      - name: Smoke (install the tarballs, run the wrapper)
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $t = Join-Path $env:RUNNER_TEMP 'npm-smoke'
          New-Item -ItemType Directory -Force $t | Out-Null
          $dist = Resolve-Path dist
          Push-Location $t
          npm init -y | Out-Null
          npm install --no-audit --no-fund "$dist/agentrouter-top-cli-win32-x64-$env:VERSION.tgz" "$dist/agentrouter-top-cli-$env:VERSION.tgz"
          $v = npx --no-install agentrouter version
          Pop-Location
          "npx agentrouter version -> $v"
          if ($v -notmatch '^agentrouter \d+\.\d+\.\d+') { throw 'the npm wrapper did not run the binary' }
      - uses: actions/upload-artifact@v7
        with:
          name: npm-${{ inputs.version }}
          path: dist/*.tgz
          retention-days: 30
