name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  linux:
    name: Linux (core + command line)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: AV hygiene (docs/AV-HYGIENE.md)
        run: bash scripts/av-hygiene.sh
      # The desktop shell (app/) is frozen: outside the workspace, not built (docs/HOSTD-MCP.md §0).
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows:
    name: Windows (command line + unsigned build)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Release build
        run: cargo build --release --locked -p agentrouter-device-cli
      - name: Version resource present (docs/AV-HYGIENE.md)
        shell: pwsh
        run: |
          foreach ($exe in 'target/release/agentrouter.exe', 'target/release/agentrouter-device.exe') {
            $v = (Get-Item $exe).VersionInfo
            "$exe | $($v.CompanyName) | $($v.ProductName) | $($v.FileVersion) | $($v.FileDescription)"
            if (-not $v.CompanyName -or -not $v.ProductName -or -not $v.FileVersion -or -not $v.FileDescription) { throw "$exe has no complete version resource" }
          }
      - name: npm packages (built and installed from local tarballs; publishing is M2)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node npm/pack.mjs --version 0.0.0 --binary win32-x64=target/release/agentrouter.exe
          $t = Join-Path $env:RUNNER_TEMP 'npm-smoke'
          New-Item -ItemType Directory -Force $t | Out-Null
          npm pack ./npm/out/cli-win32-x64 ./npm/out/agentrouter --pack-destination $t
          Push-Location $t
          npm init -y | Out-Null
          npm install --no-audit --no-fund ./agentrouter-top-cli-win32-x64-0.0.0.tgz ./agentrouter-top-cli-0.0.0.tgz
          $v = npx --no-install agentrouter version
          Pop-Location
          "npx agentrouter version -> $v"
          if ($v -notmatch '^agentrouter \d+\.\d+\.\d+') { throw 'the npm wrapper did not run the binary' }
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/agentrouter.exe, target/release/agentrouter-device.exe dist/
          @"
          The command-line helper (agentrouter.exe; agentrouter-device.exe is the same program under its old name). Run `agentrouter link` in a folder.
          Built by GitHub Actions from commit $env:GITHUB_SHA.
          NOT code-signed: Windows SmartScreen and some antivirus tools may warn. See docs/SIGNING.md.
          "@ | Set-Content -Encoding utf8 dist/README.txt
          Get-ChildItem dist | Format-Table Name, Length
          Get-FileHash dist/*.exe -Algorithm SHA256 | Format-Table Hash, Path
      - uses: actions/upload-artifact@v7
        with:
          name: agentrouter-windows-x64-unsigned
          path: dist/
          retention-days: 14

  # The OS boundary every local MCP server runs in (issue #42, docs/HOSTD-MCP.md §6): installs the pinned srt,
  # provisions the Windows sandbox account, and proves that writes, deletes, hook plants, ~/.ssh reads and direct
  # connections from a confined process (and its child shell) fail. Only here: it changes the runner machine.
  sandbox:
    name: Sandbox (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest }
          - { name: macOS, os: macos-latest }
          - { name: Windows, os: windows-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Windows: srt-win's broker starts the sandbox account's runner with CreateProcessWithLogonW, which the hosted
    # runner refuses (ERROR_ACCESS_DENIED although Secondary Logon runs: the runner's service/job context). The
    # Windows boundary is verified on a real Windows PC until a self-hosted interactive runner exists; the job still
    # runs so a change in that behaviour shows up.
    continue-on-error: ${{ matrix.name == 'Windows' }}
    env:
      AGENTROUTER_SANDBOX_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux sandbox dependencies (bubblewrap, socat, ripgrep; user namespaces)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq bubblewrap socat ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # srt-win starts the sandbox account's processes with CreateProcessWithLogonW, which needs Secondary Logon
      # (disabled on the hosted image; on people's PCs it is on by default).
      - name: Windows Secondary Logon service
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Service -Name seclogon -StartupType Manual
          Start-Service -Name seclogon
          Get-Service -Name seclogon
      - run: cargo test -p agentrouter-sandbox -- --nocapture
      - name: The aggregator runs a real MCP server confined (issue #46)
        run: cargo test -p agentrouter-aggregator -- --nocapture
      - name: The whole chain through the real CLI, and the escape cases (issue #50)
        run: cargo test -p agentrouter-device-cli --test link_e2e -- --nocapture
