name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  linux:
    name: Linux (core + command line)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: AV hygiene (docs/AV-HYGIENE.md)
        run: bash scripts/av-hygiene.sh
      # The desktop shell (app/) is built and tested on Windows only for now.
      - run: cargo clippy --workspace --exclude agentrouter-app --all-targets -- -D warnings
      - run: cargo test --workspace --exclude agentrouter-app

  windows:
    name: Windows (everything + unsigned build)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Release build
        run: cargo build --release --locked -p agentrouter-device-cli -p agentrouter-app
      - name: Version resource present (docs/AV-HYGIENE.md)
        shell: pwsh
        run: |
          foreach ($exe in 'target/release/agentrouter.exe', 'target/release/agentrouter-device.exe', 'target/release/agentrouter-desktop.exe') {
            $v = (Get-Item $exe).VersionInfo
            "$exe | $($v.CompanyName) | $($v.ProductName) | $($v.FileVersion) | $($v.FileDescription)"
            if (-not $v.CompanyName -or -not $v.ProductName -or -not $v.FileVersion -or -not $v.FileDescription) { throw "$exe has no complete version resource" }
          }
      - name: npm packages (built and installed from local tarballs; publishing is M2)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node npm/pack.mjs --version 0.0.0 --binary win32-x64=target/release/agentrouter.exe
          $t = Join-Path $env:RUNNER_TEMP 'npm-smoke'
          New-Item -ItemType Directory -Force $t | Out-Null
          npm pack ./npm/out/cli-win32-x64 ./npm/out/agentrouter --pack-destination $t
          Push-Location $t
          npm init -y | Out-Null
          npm install --no-audit --no-fund ./agentrouter-top-cli-win32-x64-0.0.0.tgz ./agentrouter-top-cli-0.0.0.tgz
          $v = npx --no-install agentrouter version
          Pop-Location
          "npx agentrouter version -> $v"
          if ($v -notmatch '^agentrouter \d+\.\d+\.\d+') { throw 'the npm wrapper did not run the binary' }
      - name: Installer (MSI to Program Files, unsigned, not self-extracting)
        working-directory: app/src-tauri
        run: npx --yes @tauri-apps/cli@2.12.1 build --bundles msi --ci
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/agentrouter.exe, target/release/agentrouter-device.exe, target/release/agentrouter-desktop.exe dist/
          Copy-Item target/release/bundle/msi/*.msi dist/
          @"
          The command-line helper (agentrouter.exe; agentrouter-device.exe is the same program under its old name) and the desktop app (agentrouter-desktop.exe).
          Built by GitHub Actions from commit $env:GITHUB_SHA.
          NOT code-signed: Windows SmartScreen and some antivirus tools may warn. See docs/SIGNING.md.
          "@ | Set-Content -Encoding utf8 dist/README.txt
          Get-ChildItem dist | Format-Table Name, Length
          Get-FileHash dist/*.exe, dist/*.msi -Algorithm SHA256 | Format-Table Hash, Path
      - uses: actions/upload-artifact@v7
        with:
          name: agentrouter-windows-x64-unsigned
          path: dist/
          retention-days: 14
