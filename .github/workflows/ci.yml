name: CI

# Every check of this repository, on GitHub-hosted runners only (R47; locally only `go build` / `go vet`):
# - Repository checks: docs map and links, no path into another repository, AV hygiene, the main-red guard's decisions.
# - Client (Linux / macOS / Windows): the Go device client in client/ (NetBird client/embed for the network, its own
#   SSH server; base layers v1, #221): gofmt, go mod tidy, vet, tests, build.
# - After a push to main: the static Linux builds (compute/v1 sandboxes) and the Windows Dev build, published as the
#   pre-release `client-v0.0.0-<sha7>`.
# Required checks of the branch protection, also in merge-on-green.yml REQUIRED: `Repository checks`, `Client (Linux)`,
# `Client (macOS)`, `Client (Windows)` (each 1–2 min). A red main is re-run once, then reverted or reported (main-red.yml).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A PR's newer push cancels its older run. Every push to main runs to the end (#125): the main-red guard compares a red
# run with its parent's, so no merge may go untested.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: AV hygiene (docs/development/AV-HYGIENE.md)
        run: bash scripts/av-hygiene.sh
      # The pinned lychee (scripts/lychee.mjs) is downloaded once and kept here, so the doc check stays seconds.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/agentrouter-ci
          key: lychee-0.24.2-${{ runner.os }}
      - name: Docs placed, mapped and linked (docs/README.md)
        run: node scripts/check-docs.mjs
      - name: No path into another repository (agentteam-deployments docs/development/CONTRACTS.md C6)
        run: node scripts/check-repo-imports.mjs
      - name: main-red guard decisions (scripts/main-red.mjs, #125)
        run: node --test scripts/*.test.mjs

  client:
    name: Client (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest, exe: agentdevice, ldflags: "" }
          - { name: macOS, os: macos-latest, exe: agentdevice, ldflags: "" }
          - { name: Windows, os: windows-latest, exe: agentdevice.exe, ldflags: "-H windowsgui" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: client/go.mod
          cache-dependency-path: client/go.sum
      - name: gofmt
        if: matrix.name == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go mod tidy is clean
        if: matrix.name == 'Linux'
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - run: go vet ./...
      - run: go test -count=1 -timeout 10m ./...
      - name: Build
        run: go build -trimpath -ldflags "-s -w -X main.version=0.0.0-${GITHUB_SHA::7} ${{ matrix.ldflags }}" -o "dist/${{ matrix.exe }}" ./cmd/agentdevice
      - name: SHA-256
        run: |
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum ${{ matrix.exe }}; else shasum -a 256 ${{ matrix.exe }}; fi
      # A pre-release build for Dev testing (no release, no signing; docs/adr/0001-code-signing.md).
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: agentdevice-${{ matrix.name }}-${{ runner.arch }}
          path: client/dist/${{ matrix.exe }}
          retention-days: 14

  # A pre-release only when the program changed: a push to main (or a dispatch) that touches client/.
  changes:
    name: Client changed?
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      client: ${{ steps.diff.outputs.client }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != push ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then echo client=true >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --quiet "$BEFORE" "$GITHUB_SHA" -- client .github/workflows/ci.yml; then echo client=false; else echo client=true; fi >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  # Static Linux builds for compute/v1 sandboxes (AgentCompute's environment image pins one by tag + sha256,
  # #223): every push to main that changes client/ (job `changes`) publishes `client-v0.0.0-<sha7>`.
  # Not a person's release (no signing, no npm; docs/adr/0001-code-signing.md).
  linux:
    name: Client (Linux ${{ matrix.arch }}, static)
    if: needs.changes.outputs.client == 'true'
    needs: [client, changes]
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: client/go.mod
          cache-dependency-path: client/go.sum
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=0.0.0-${GITHUB_SHA::7}" -o "dist/agentdevice-linux-${{ matrix.arch }}" ./cmd/agentdevice
          cd dist && sha256sum "agentdevice-linux-${{ matrix.arch }}" > "agentdevice-linux-${{ matrix.arch }}.sha256" && cat ./*.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: client-linux-${{ matrix.arch }}
          path: client/dist/agentdevice-linux-*
          retention-days: 14

  # The Windows build for Dev devices (#231): the person's computer, with Dev's endpoints built in (state.Default*:
  # AgentIdentity's STS and ZITADEL, compute/v1), so installing it and starting it is all a person does. Dev only:
  # no signing, no release for people (docs/adr/0001-code-signing.md). The hosted-runner end-to-end check
  # (windows-e2e.yml) installs it from the pre-release.
  windows:
    name: Client (Windows amd64, Dev)
    if: needs.changes.outputs.client == 'true'
    needs: [client, changes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: client/go.mod
          cache-dependency-path: client/go.sum
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          st=github.com/agentrouter-top/AgentDevice/client/internal/state
          dev="-X $st.DefaultIssuer=https://identity-dev.agentrouter.page -X $st.DefaultComputeURL=https://compute-dev.agentrouter.page"
          dev="$dev -X $st.DefaultZitadelURL=https://login-dev.agentrouter.page -X $st.DefaultZitadelProjectID=398174617035870308"
          dev="$dev -X $st.DefaultZitadelClientID=398174617103044708"
          go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=0.0.0-${GITHUB_SHA::7} $dev" -o dist/agentdevice-windows-amd64.exe ./cmd/agentdevice
          cd dist && sha256sum agentdevice-windows-amd64.exe > agentdevice-windows-amd64.exe.sha256 && cat ./*.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: client-windows-amd64
          path: client/dist/agentdevice-windows-amd64*
          retention-days: 14

  publish:
    name: Publish client pre-release
    needs: [linux, windows]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: client-*
          merge-multiple: true
      - name: Release client-v0.0.0-<sha7>
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          tag="client-v0.0.0-${GITHUB_SHA::7}"
          cat agentdevice-*.sha256 > SHA256SUMS
          cat SHA256SUMS
          assets=(agentdevice-linux-amd64 agentdevice-linux-arm64 agentdevice-windows-amd64.exe SHA256SUMS)
          notes=$(printf '%s\n' \
            "Go client (agentdevice), commit ${GITHUB_SHA}. Not a release for people (no signing)." \
            "- Static Linux builds for compute/v1 sandboxes: a sandbox runs \`agentdevice sandbox --join /etc/agentcompute/network.json\` (compute/v1 README §7.1). Pin by tag + SHA256SUMS." \
            "- \`agentdevice-windows-amd64.exe\`: a Windows device on **Dev** (Dev's login and compute/v1 built in); start it, confirm the login in the browser." \
            "" '```' "$(cat SHA256SUMS)" '```')
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "client ${GITHUB_SHA::7} (Linux sandboxes, Windows Dev)" --notes "$notes"
          fi
