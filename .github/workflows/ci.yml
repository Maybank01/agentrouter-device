name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  linux:
    name: Linux (core + command line)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: AV hygiene (docs/AV-HYGIENE.md)
        run: bash scripts/av-hygiene.sh
      # The desktop shell (app/) is built and tested on Windows only for now.
      - run: cargo clippy --workspace --exclude agentrouter-app --all-targets -- -D warnings
      - run: cargo test --workspace --exclude agentrouter-app

  windows:
    name: Windows (everything + unsigned build)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Release build
        run: cargo build --release --locked -p agentrouter-device-cli -p agentrouter-app
      - name: Version resource present (docs/AV-HYGIENE.md)
        shell: pwsh
        run: |
          foreach ($exe in 'target/release/agentrouter.exe', 'target/release/agentrouter-device.exe') {
            $v = (Get-Item $exe).VersionInfo
            "$exe | $($v.CompanyName) | $($v.ProductName) | $($v.FileVersion) | $($v.FileDescription)"
            if (-not $v.CompanyName -or -not $v.ProductName -or -not $v.FileVersion -or -not $v.FileDescription) { throw "$exe has no complete version resource" }
          }
      - name: Installer (MSI to Program Files, unsigned, not self-extracting)
        working-directory: app/src-tauri
        # The command-line connector goes next to agentrouter.exe (local MCP: `agentrouter-device mcp`).
        run: npx --yes @tauri-apps/cli@2.12.1 build --bundles msi --ci --config tauri.msi.conf.json
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/agentrouter.exe, target/release/agentrouter-device.exe dist/
          Copy-Item target/release/bundle/msi/*.msi dist/
          @"
          AgentRouter desktop (agentrouter.exe) and the command-line connector (agentrouter-device.exe).
          Built by GitHub Actions from commit $env:GITHUB_SHA.
          NOT code-signed: Windows SmartScreen and some antivirus tools may warn. See docs/SIGNING.md.
          "@ | Set-Content -Encoding utf8 dist/README.txt
          Get-ChildItem dist | Format-Table Name, Length
          Get-FileHash dist/*.exe, dist/*.msi -Algorithm SHA256 | Format-Table Hash, Path
      - uses: actions/upload-artifact@v7
        with:
          name: agentrouter-windows-x64-unsigned
          path: dist/
          retention-days: 14

  gui-smoke:
    name: Windows GUI smoke (screenshots)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: gui-smoke
      - name: Build (smoke feature, never shipped)
        run: cargo build --release --locked -p agentrouter-device-cli -p agentrouter-app --features agentrouter-app/smoke
      - name: Larger screen
        shell: pwsh
        continue-on-error: true
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Run the app through its scenes and take screenshots
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          $env:AGENTROUTER_DEVICE_HOME = Join-Path $root 'smoke-home'
          $env:AGENTROUTER_SMOKE_DIR = Join-Path $root 'smoke-out'
          New-Item -ItemType Directory -Force smoke-home, smoke-out, shots | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shoot([string]$path) {
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
            $bmp.Save($path, [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
          function Check-Mcp {
            # A local AI's view: the real `agentrouter-device mcp` front end talking to the running app.
            $lines = @(
              '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci-smoke","version":"1"}}}',
              '{"jsonrpc":"2.0","method":"notifications/initialized"}',
              '{"jsonrpc":"2.0","id":2,"method":"tools/list"}',
              '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"list_devices","arguments":{}}}'
            )
            $out = $lines | & (Join-Path $root 'target/release/agentrouter-device.exe') mcp
            $out | Set-Content -Encoding utf8 smoke-out/mcp.txt
            if (-not (($out -join "`n") -match '"device":"this"')) { throw "local MCP did not list this computer" }
            & (Join-Path $root 'target/release/agentrouter-device.exe') mcp setup | Set-Content -Encoding utf8 smoke-out/mcp-setup.txt
          }
          $app = Start-Process -FilePath (Join-Path $root 'target/release/agentrouter.exe') -PassThru
          $seen = @{}
          $mcpChecked = $false
          $deadline = (Get-Date).AddMinutes(15)
          while ((Get-Date) -lt $deadline -and -not $app.HasExited) {
            $scene = Get-Content smoke-out/scene.txt -ErrorAction SilentlyContinue
            if ($scene -and $scene -ne 'done' -and -not $seen.ContainsKey($scene)) {
              $seen[$scene] = $true
              Shoot (Join-Path $root "shots/$scene.png")
              Set-Content "smoke-out/$scene.shot" 'ok'
              "shot $scene"
              if (-not $mcpChecked) { Check-Mcp; $mcpChecked = $true }
            }
            Start-Sleep -Milliseconds 300
          }
          if (-not $app.HasExited) { Shoot (Join-Path $root 'shots/zz-timeout.png'); Stop-Process -Id $app.Id; throw 'the smoke run did not finish' }
          Get-Content smoke-out/results.json
          $results = Get-Content smoke-out/results.json -Raw | ConvertFrom-Json
          if (-not $results.ok -or $app.ExitCode -ne 0) { throw 'smoke checks failed' }
      - name: Logs
        if: always()
        shell: pwsh
        run: Get-ChildItem smoke-home -Recurse -Filter *.log | ForEach-Object { Copy-Item $_.FullName smoke-out/ }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gui-smoke-screenshots
          path: |
            shots/
            smoke-out/
          retention-days: 14
